<div class="login-page">
  <div class="login-card">

    <!-- Header -->
    <div class="login-header">
      <h1>Sign In</h1>
      <p>Angular Auth Demo</p>
    </div>

    <!-- Form -->
    <form (ngSubmit)="onLogin()" #loginForm="ngForm">

      <!-- Error -->
      @if (errorMessage) {
        <div class="error-banner">{{ errorMessage }}</div>
      }

      <!-- Username -->
      <div class="form-group">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          placeholder="Enter username"
          [(ngModel)]="username"
          name="username"
          [disabled]="isLoading"
        />
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          placeholder="Enter password"
          [(ngModel)]="password"
          name="password"
          [disabled]="isLoading"
        />
      </div>

      <!-- Submit -->
      <button id="login-btn" type="submit" class="login-btn" [disabled]="isLoading">
        @if (isLoading) {
          <span class="spinner"></span> Signing in...
        } @else {
          Sign In
        }
      </button>

    </form>

    <!-- Demo credentials hint -->
    <p class="hint">Demo: <strong>emilys</strong> / <strong>emilyspass</strong></p>

  </div>
</div>
